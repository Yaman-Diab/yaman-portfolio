name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you run the deploy by hand from the Actions tab.
  workflow_dispatch:

# The least the workflow needs: read the code, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits for the running one to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Reads the site address from the repository's Pages settings, so a
      # custom domain needs no change here or in the code.
      - name: Read the Pages settings
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      # Type-checks, validates the content and builds. Any failure stops the deploy.
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Check links and metadata
        run: npm run qa
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
